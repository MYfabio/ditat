# Copia de seguretat diaria de la base de dades, i neteja del que ja no cal.
#
# Railway nomes fa copies automatiques al pla Pro. Sense cap copia, un esborrat
# accidental o una avaria del volum s'emporta la feina d'un curs sencer.
#
# ATENCIO: aquest repositori es PUBLIC, i els fitxers que genera una tasca
# d'un repositori public els pot descarregar qualsevol. Per aixo el volcat es
# xifra ABANS de pujar-lo. Sense la contrasenya, el que es publica es un
# fitxer illegible. No treguis mai el pas de xifrat.

name: Copia de seguretat

on:
  schedule:
    # 03:15 UTC cada dia: de matinada a Catalunya, amb l'aula buida.
    - cron: "15 3 * * *"
  workflow_dispatch:

jobs:
  copia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprovar que hi ha els secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Falta el secret DATABASE_URL."; exit 1
          fi
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "Falta el secret BACKUP_PASSPHRASE. Sense xifrar no es puja res."; exit 1
          fi

      - name: Instalar pg_dump 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Volcar i xifrar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          nom="dictats-$(date -u +%Y%m%d-%H%M).sql.gz.gpg"
          # El volcat no toca mai el disc sense xifrar: va per canonada.
          pg_dump --no-owner --no-privileges "$DATABASE_URL" \
            | gzip -9 \
            | gpg --batch --yes --symmetric --cipher-algo AES256 \
                  --passphrase "$BACKUP_PASSPHRASE" -o "$nom"
          echo "NOM_COPIA=$nom" >> "$GITHUB_ENV"
          ls -lh "$nom"

      - name: Comprovar que la copia no es buida
        run: |
          mida=$(stat -c%s "$NOM_COPIA")
          # Una base de dades amb dades reals no baixa mai de 10 kB xifrada.
          if [ "$mida" -lt 10240 ]; then
            echo "La copia fa nomes $mida bytes: alguna cosa ha anat malament."; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOM_COPIA }}
          path: ${{ env.NOM_COPIA }}
          retention-days: 30

  neteja:
    runs-on: ubuntu-latest
    needs: copia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Esborrar fotos i locucions que ja no calen
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Nomes despres que la copia hagi anat be: si no, s'esborraria sense xarxa.
          node scripts/prune-submission-photos.mjs --dies=60 --esborra
          node scripts/prune-dictation-audio.mjs --dies=30 --esborra
